plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group 'com.strangertheme'
version '1.0.2'

repositories {
    mavenCentral()
}

intellij {
    version = '2023.3'
    type = 'IC' // IntelliJ IDEA Community Edition
    plugins = []
    updateSinceUntilBuild = false
}

tasks {
    patchPluginXml {
        sinceBuild = '191'
        untilBuild = ''
    }

    buildSearchableOptions {
        enabled = false
    }

    publishPlugin {
        // Token can be set via environment variable or gradle.properties:
        // export ORG_GRADLE_PROJECT_intellijPublishToken=YOUR_TOKEN
        // or add to ~/.gradle/gradle.properties: intellijPublishToken=YOUR_TOKEN
        token = project.findProperty('intellijPublishToken') ?: System.getenv('JETBRAINS_MARKETPLACE_TOKEN')

        // Channel can be overridden via -Pchannel=beta
        def channel = project.findProperty('channel') ?: 'stable'
        channels = [channel]  // Options: 'stable', 'beta', 'alpha'
    }
}
