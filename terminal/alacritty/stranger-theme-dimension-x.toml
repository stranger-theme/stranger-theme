# Stranger Theme: Dimension X for Alacritty
# https://github.com/stranger-theme/stranger-theme/tree/main/terminal/alacritty

[colors.primary]
background = "#1E1A1A"
foreground = "#E8D5D5"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#1E1A1A"
cursor = "#E8D5D5"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#523535"

[colors.normal]
black = "#464242"
red = "#FF6B6B"
green = "#8FAE7E"
yellow = "#D19A66"
blue = "#C678DD"
magenta = "#FF55AA"
cyan = "#7FB5B0"
white = "#E8D5D5"

[colors.bright]
black = "#9A7C7C"
red = "#FF8989"
green = "#ADCC9C"
yellow = "#EFB884"
blue = "#E496FB"
magenta = "#FF73C8"
cyan = "#9DD3CE"
white = "#FFFFFF"

[colors.search.matches]
foreground = "#1E1A1A"
background = "#8B7355"

[colors.search.focused_match]
foreground = "#1E1A1A"
background = "#FF6B6B"

[colors.footer_bar]
background = "#1E1A1A"
foreground = "#E8D5D5"

[colors.hints.start]
foreground = "#1E1A1A"
background = "#BCA89F"

[colors.hints.end]
foreground = "#BCA89F"
background = "#1E1A1A"
