# Stranger Theme: Starcourt for Alacritty
# https://github.com/stranger-theme/alacritty

[colors.primary]
background = "#1A1A2E"
foreground = "#EAEAEA"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#1A1A2E"
cursor = "#EAEAEA"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#2E2E4A"

[colors.normal]
black = "#1A1A2E"
red = "#FF6B6B"
green = "#00FA9A"
yellow = "#FFD700"
blue = "#BA55D3"
magenta = "#FF1493"
cyan = "#00CED1"
white = "#EAEAEA"

[colors.bright]
black = "#6B5B95"
red = "#FF8989"
green = "#1EFFB8"
yellow = "#FFF51E"
blue = "#D873F1"
magenta = "#FF32B1"
cyan = "#1EECEF"
white = "#FFFFFF"

[colors.search.matches]
foreground = "#2E2E4A"
background = "#00FA9A"

[colors.search.focused_match]
foreground = "#2E2E4A"
background = "#FFB347"

[colors.footer_bar]
background = "#1A1A2E"
foreground = "#EAEAEA"

[colors.hints.start]
foreground = "#1A1A2E"
background = "#FFD700"

[colors.hints.end]
foreground = "#FFD700"
background = "#1A1A2E"
