# Stranger Theme: Upside Down for Alacritty
# https://github.com/stranger-theme/alacritty

[colors.primary]
background = "#0D1117"
foreground = "#F8F8F2"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#0D1117"
cursor = "#F8F8F2"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#2A3C4A"

[colors.normal]
black = "#0D1117"
red = "#E06C75"
green = "#98C379"
yellow = "#E5C07B"
blue = "#61AFEF"
magenta = "#C678DD"
cyan = "#56B6C2"
white = "#F8F8F2"

[colors.bright]
black = "#5C6370"
red = "#FE8A93"
green = "#B6E197"
yellow = "#FFDE99"
blue = "#7FCDFF"
magenta = "#E496FB"
cyan = "#74D4E0"
white = "#FFFFFF"

[colors.search.matches]
foreground = "#2A3C4A"
background = "#98C379"

[colors.search.focused_match]
foreground = "#2A3C4A"
background = "#D19A66"

[colors.footer_bar]
background = "#0D1117"
foreground = "#F8F8F2"

[colors.hints.start]
foreground = "#0D1117"
background = "#E5C07B"

[colors.hints.end]
foreground = "#E5C07B"
background = "#0D1117"
