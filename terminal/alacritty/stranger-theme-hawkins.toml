# Stranger Theme: Hawkins for Alacritty
# https://github.com/stranger-theme/alacritty

[colors.primary]
background = "#2C2218"
foreground = "#E8DCC8"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#2C2218"
cursor = "#E8DCC8"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#4D4339"

[colors.normal]
black = "#544A40"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#88C0D0"
white = "#E8DCC8"

[colors.bright]
black = "#9E8766"
red = "#DD7F88"
green = "#C1DCAA"
yellow = "#FFE9A9"
blue = "#9FBFDF"
magenta = "#D2ACCB"
cyan = "#A6DEEE"
white = "#FFFFFF"

[colors.search.matches]
foreground = "#2C2218"
background = "#A3BE8C"

[colors.search.focused_match]
foreground = "#2C2218"
background = "#D08770"

[colors.footer_bar]
background = "#2C2218"
foreground = "#E8DCC8"

[colors.hints.start]
foreground = "#2C2218"
background = "#EBCB8B"

[colors.hints.end]
foreground = "#EBCB8B"
background = "#2C2218"
