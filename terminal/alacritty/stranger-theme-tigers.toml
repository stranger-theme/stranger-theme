# Stranger Theme: Tigers for Alacritty
# https://github.com/stranger-theme/alacritty

[colors.primary]
background = "#1A1A1A"
foreground = "#F5F5F5"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#1A1A1A"
cursor = "#F5F5F5"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#2A2A2A"

[colors.normal]
black = "#1A1A1A"
red = "#CC6666"
green = "#B5BD68"
yellow = "#F0C674"
blue = "#B294BB"
magenta = "#FF7F2A"
cyan = "#81A2BE"
white = "#F5F5F5"

[colors.bright]
black = "#5C5C5C"
red = "#EA8484"
green = "#D3DB86"
yellow = "#FFE492"
blue = "#D0B2D9"
magenta = "#FF9D48"
cyan = "#9FC0DC"
white = "#FFFFFF"

[colors.search.matches]
foreground = "#2A2A2A"
background = "#B5BD68"

[colors.search.focused_match]
foreground = "#2A2A2A"
background = "#DE935F"

[colors.footer_bar]
background = "#1A1A1A"
foreground = "#F5F5F5"

[colors.hints.start]
foreground = "#1A1A1A"
background = "#F0C674"

[colors.hints.end]
foreground = "#F0C674"
background = "#1A1A1A"
