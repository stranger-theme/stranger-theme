# Stranger Theme: Tigers for Alacritty
# https://github.com/stranger-theme/alacritty

[colors.primary]
background = "#181E18"
foreground = "#F5F5F5"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#181E18"
cursor = "#F5F5F5"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#38463A"

[colors.normal]
black = "#404640"
red = "#CC6666"
green = "#B5BD68"
yellow = "#F0C674"
blue = "#81A2BE"
magenta = "#B294BB"
cyan = "#8ABEB7"
white = "#F5F5F5"

[colors.bright]
black = "#758975"
red = "#EA8484"
green = "#D3DB86"
yellow = "#FFE492"
blue = "#9FC0DC"
magenta = "#D0B2D9"
cyan = "#A8DCD5"
white = "#FFFFFF"

[colors.search.matches]
foreground = "#181E18"
background = "#B5BD68"

[colors.search.focused_match]
foreground = "#181E18"
background = "#DE935F"

[colors.footer_bar]
background = "#181E18"
foreground = "#F5F5F5"

[colors.hints.start]
foreground = "#181E18"
background = "#F0C674"

[colors.hints.end]
foreground = "#F0C674"
background = "#181E18"
