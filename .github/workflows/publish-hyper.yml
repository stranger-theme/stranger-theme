name: Publish Hyper Themes to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build Hyper themes
        run: npm run build:hyper

      - name: Publish all Hyper theme packages
        run: |
          cd hyper/themes
          for dir in */; do
            if [ -f "$dir/package.json" ]; then
              echo "📦 Publishing $dir..."
              cd "$dir"
              npm publish --access public || echo "⚠️ Failed to publish $dir (may already exist)"
              cd ..
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
