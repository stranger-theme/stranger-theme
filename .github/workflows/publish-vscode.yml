name: Publish VS Code Extension

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    secrets:
      VSCE_PAT:
        required: true
      OVSX_PAT:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd visual-studio-code && npm ci

      - name: Build themes
        run: npm run build:vscode

      - name: Package extension
        id: package
        run: |
          cd visual-studio-code
          npx --no-install vsce package --out stranger-theme.vsix

      - name: Publish to VS Code Marketplace
        run: |
          cd visual-studio-code
          npx --no-install vsce publish --packagePath stranger-theme.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.OVSX_PAT != '' }}
        run: |
          cd visual-studio-code
          npx --yes ovsx publish stranger-theme.vsix -p "$OVSX_PAT"

      - name: Report missing Open VSX credentials
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.OVSX_PAT == '' }}
        run: echo '::warning::Open VSX was not published because OVSX_PAT is missing.'

      - name: Upload VSIX artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: visual-studio-code/*.vsix
