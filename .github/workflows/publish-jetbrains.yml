name: Publish JetBrains Plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false
      channel:
        description: 'Release channel (stable, beta, alpha)'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
  workflow_call:
    secrets:
      JETBRAINS_MARKETPLACE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Resolve package version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$(node -p "require('./jetbrains/package.json').version")}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build themes and icons
        run: npm run build:jetbrains

      - name: Build plugin
        run: |
          cd jetbrains
          gradle buildPlugin -PreleaseVersion="$PLUGIN_VERSION"

      - name: Verify plugin
        run: |
          cd jetbrains
          gradle verifyPlugin -PreleaseVersion="$PLUGIN_VERSION"

      - name: Publish to JetBrains Marketplace
        run: |
          cd jetbrains
          gradle publishPlugin \
            -PreleaseVersion="$PLUGIN_VERSION" \
            -Pchannel="$RELEASE_CHANNEL"
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          ORG_GRADLE_PROJECT_intellijPublishToken: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: jetbrains/build/distributions/*.zip
