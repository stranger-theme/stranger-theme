name: Publish Palette Package to npm

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build palette package
        run: npm run build:palette

      - name: Publish palette package
        run: |
          cd palette
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
