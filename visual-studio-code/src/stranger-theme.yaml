# Stranger Theme
# Base theme template - all variants are generated from this file
# Colors use {{PLACEHOLDER}} syntax that gets replaced by the build script
semanticHighlighting: true

# =============================================================================
# User Interface Colors
# =============================================================================
colors:
  # Integrated Terminal Colors
  terminal.background: "{{BG}}"
  terminal.foreground: "{{FG}}"
  terminal.ansiBrightBlack: "{{COMMENT}}"
  terminal.ansiBrightRed: "{{RED}}"
  terminal.ansiBrightGreen: "{{GREEN}}"
  terminal.ansiBrightYellow: "{{YELLOW}}"
  terminal.ansiBrightBlue: "{{PURPLE}}"
  terminal.ansiBrightMagenta: "{{PINK}}"
  terminal.ansiBrightCyan: "{{CYAN}}"
  terminal.ansiBrightWhite: "{{WHITE}}"
  terminal.ansiBlack: "{{BG}}"
  terminal.ansiRed: "{{RED}}"
  terminal.ansiGreen: "{{GREEN}}"
  terminal.ansiYellow: "{{YELLOW}}"
  terminal.ansiBlue: "{{PURPLE}}"
  terminal.ansiMagenta: "{{PINK}}"
  terminal.ansiCyan: "{{CYAN}}"
  terminal.ansiWhite: "{{FG}}"

  # Base Colors
  focusBorder: "{{COMMENT}}"
  foreground: "{{FG}}"
  selection.background: "{{PURPLE}}"
  errorForeground: "{{RED}}"
  descriptionForeground: "{{COMMENT}}"

  # Button Control
  button.background: "{{SELECTION}}"
  button.foreground: "{{FG}}"
  button.hoverBackground: "{{BGLighter}}"
  button.secondaryBackground: "{{BG}}"
  button.secondaryForeground: "{{FG}}"
  button.secondaryHoverBackground: "{{BGLight}}"

  # Dropdown Control
  dropdown.background: "{{BGLight}}"
  dropdown.border: "{{BGDarker}}"
  dropdown.foreground: "{{FG}}"

  # Input Control
  input.background: "{{BG}}"
  input.foreground: "{{FG}}"
  input.border: "{{BGDarker}}"
  input.placeholderForeground: "{{COMMENT}}"
  inputOption.activeBorder: "{{PURPLE}}"
  inputValidation.infoBorder: "{{PINK}}"
  inputValidation.warningBorder: "{{ORANGE}}"
  inputValidation.errorBorder: "{{RED}}"

  # Scroll Bar
  scrollbarSlider.background: "{{COMMENT}}"
  scrollbarSlider.hoverBackground: "{{PURPLE}}"
  scrollbarSlider.activeBackground: "{{PURPLE}}"

  # Badge
  badge.foreground: "{{FG}}"
  badge.background: "{{SELECTION}}"

  # Progress Bar
  progressBar.background: "{{PINK}}"

  # Lists and Trees
  list.activeSelectionBackground: "{{SELECTION}}"
  list.activeSelectionForeground: "{{FG}}"
  list.dropBackground: "{{SELECTION}}"
  list.focusBackground: "{{LineHighlight}}"
  list.highlightForeground: "{{CYAN}}"
  list.hoverBackground: "{{LineHighlight}}"
  list.inactiveSelectionBackground: "{{LineHighlight}}"
  list.warningForeground: "{{ORANGE}}"
  list.errorForeground: "{{RED}}"

  # Activity Bar
  activityBar.background: "{{BGLight}}"
  activityBar.inactiveForeground: "{{COMMENT}}"
  activityBar.foreground: "{{FG}}"
  activityBar.activeBorder: "{{PINK}}"
  activityBarBadge.background: "{{PINK}}"
  activityBarBadge.foreground: "{{FG}}"

  # Side Bar
  sideBar.background: "{{BGDark}}"
  sideBarTitle.foreground: "{{FG}}"
  sideBarSectionHeader.background: "{{BG}}"
  sideBarSectionHeader.border: "{{BGDarker}}"

  # Editor Group & Tabs
  editorGroup.border: "{{PURPLE}}"
  editorGroup.dropBackground: "{{BGLighter}}"
  editorGroupHeader.tabsBackground: "{{BGDarker}}"
  tab.activeBackground: "{{BG}}"
  tab.activeForeground: "{{FG}}"
  tab.border: "{{BGDarker}}"
  tab.activeBorderTop: "{{PINK}}"
  tab.inactiveBackground: "{{BGDark}}"
  tab.inactiveForeground: "{{COMMENT}}"

  # Editor Colors
  editor.foreground: "{{FG}}"
  editor.background: "{{BG}}"
  editorLineNumber.foreground: "{{COMMENT}}"
  editorLineNumber.activeForeground: "{{FG}}"
  editor.selectionBackground: "{{SELECTION}}"
  editor.selectionHighlightBackground: "{{BGLighter}}"
  editor.foldBackground: "{{BGDark}}"
  editor.wordHighlightBackground: "{{BGLighter}}"
  editor.wordHighlightStrongBackground: "{{BGLighter}}"
  editor.findMatchBackground: "{{ORANGE}}"
  editor.findMatchHighlightBackground: "{{BGLighter}}"
  editor.findRangeHighlightBackground: "{{LineHighlight}}"
  editor.hoverHighlightBackground: "{{BGLighter}}"
  editor.lineHighlightBorder: "{{SELECTION}}"
  editorLink.activeForeground: "{{CYAN}}"
  editor.rangeHighlightBackground: "{{BGLight}}"
  editor.snippetTabstopHighlightBackground: "{{BG}}"
  editor.snippetTabstopHighlightBorder: "{{COMMENT}}"
  editor.snippetFinalTabstopHighlightBackground: "{{BG}}"
  editor.snippetFinalTabstopHighlightBorder: "{{GREEN}}"
  editorWhitespace.foreground: "{{NonText}}"
  editorIndentGuide.background: "{{NonText}}"
  editorIndentGuide.activeBackground: "{{COMMENT}}"
  editorRuler.foreground: "{{NonText}}"
  editorCodeLens.foreground: "{{COMMENT}}"

  # Bracket colors
  editorBracketHighlight.foreground1: "{{FG}}"
  editorBracketHighlight.foreground2: "{{PINK}}"
  editorBracketHighlight.foreground3: "{{CYAN}}"
  editorBracketHighlight.foreground4: "{{GREEN}}"
  editorBracketHighlight.foreground5: "{{PURPLE}}"
  editorBracketHighlight.foreground6: "{{ORANGE}}"
  editorBracketHighlight.unexpectedBracket.foreground: "{{RED}}"

  # Overview Ruler
  editorOverviewRuler.border: "{{BGDarker}}"
  editorOverviewRuler.selectionHighlightForeground: "{{ORANGE}}"
  editorOverviewRuler.wordHighlightForeground: "{{CYAN}}"
  editorOverviewRuler.wordHighlightStrongForeground: "{{GREEN}}"
  editorOverviewRuler.modifiedForeground: "{{CYAN}}"
  editorOverviewRuler.addedForeground: "{{GREEN}}"
  editorOverviewRuler.deletedForeground: "{{RED}}"
  editorOverviewRuler.errorForeground: "{{RED}}"
  editorOverviewRuler.warningForeground: "{{ORANGE}}"
  editorOverviewRuler.infoForeground: "{{CYAN}}"

  # Errors and Warnings
  editorError.foreground: "{{RED}}"
  editorWarning.foreground: "{{CYAN}}"

  # Gutter
  editorGutter.modifiedBackground: "{{CYAN}}"
  editorGutter.addedBackground: "{{GREEN}}"
  editorGutter.deletedBackground: "{{RED}}"

  # Git Decorations
  gitDecoration.modifiedResourceForeground: "{{CYAN}}"
  gitDecoration.deletedResourceForeground: "{{RED}}"
  gitDecoration.untrackedResourceForeground: "{{GREEN}}"
  gitDecoration.ignoredResourceForeground: "{{COMMENT}}"
  gitDecoration.conflictingResourceForeground: "{{ORANGE}}"

  # Diff Editor
  diffEditor.insertedTextBackground: '#98C37920'
  diffEditor.removedTextBackground: '#E06C7550'

  # Editor Widget
  editorWidget.background: "{{BGDark}}"
  editorSuggestWidget.background: "{{BGDark}}"
  editorSuggestWidget.foreground: "{{FG}}"
  editorSuggestWidget.selectedBackground: "{{SELECTION}}"
  editorHoverWidget.background: "{{BG}}"
  editorHoverWidget.border: "{{COMMENT}}"

  # Peek View
  peekView.border: "{{SELECTION}}"
  peekViewEditor.background: "{{BG}}"
  peekViewEditor.matchHighlightBackground: "{{YELLOW}}"
  peekViewResult.background: "{{BGDark}}"
  peekViewResult.fileForeground: "{{FG}}"
  peekViewResult.lineForeground: "{{FG}}"
  peekViewResult.matchHighlightBackground: "{{YELLOW}}"
  peekViewResult.selectionBackground: "{{SELECTION}}"
  peekViewResult.selectionForeground: "{{FG}}"
  peekViewTitle.background: "{{BGDarker}}"
  peekViewTitleDescription.foreground: "{{COMMENT}}"
  peekViewTitleLabel.foreground: "{{FG}}"

  # Merge Conflicts
  merge.currentHeaderBackground: '#98C37990'
  merge.incomingHeaderBackground: '#61AFEF90'
  editorOverviewRuler.currentContentForeground: "{{GREEN}}"
  editorOverviewRuler.incomingContentForeground: "{{PURPLE}}"

  # Panel
  panel.background: "{{BG}}"
  panel.border: "{{PURPLE}}"
  panelTitle.activeBorder: "{{PINK}}"
  panelTitle.activeForeground: "{{FG}}"
  panelTitle.inactiveForeground: "{{COMMENT}}"

  # Status Bar
  statusBar.background: "{{BGDarker}}"
  statusBar.foreground: "{{FG}}"
  statusBar.debuggingBackground: "{{RED}}"
  statusBar.debuggingForeground: "{{BGDarker}}"
  statusBar.noFolderBackground: "{{BGDarker}}"
  statusBar.noFolderForeground: "{{FG}}"
  statusBarItem.prominentBackground: "{{RED}}"
  statusBarItem.prominentHoverBackground: "{{ORANGE}}"
  statusBarItem.remoteForeground: "{{BG}}"
  statusBarItem.remoteBackground: "{{PURPLE}}"

  # Title Bar
  titleBar.activeBackground: "{{BGDark}}"
  titleBar.activeForeground: "{{FG}}"
  titleBar.inactiveBackground: "{{BGDarker}}"
  titleBar.inactiveForeground: "{{COMMENT}}"

  # Extensions
  extensionButton.prominentForeground: "{{FG}}"
  extensionButton.prominentBackground: '#98C37990'
  extensionButton.prominentHoverBackground: '#98C37960'

  # Quick Picker
  pickerGroup.border: "{{PURPLE}}"
  pickerGroup.foreground: "{{CYAN}}"

  # Debug
  debugToolBar.background: "{{BGDark}}"

  # Welcome Page
  walkThrough.embeddedEditorBackground: "{{BGDark}}"

  # Settings
  settings.headerForeground: "{{FG}}"
  settings.modifiedItemIndicator: "{{ORANGE}}"
  settings.dropdownBackground: "{{BGDark}}"
  settings.dropdownForeground: "{{FG}}"
  settings.dropdownBorder: "{{BGDarker}}"
  settings.checkboxBackground: "{{BGDark}}"
  settings.checkboxForeground: "{{FG}}"
  settings.checkboxBorder: "{{BGDarker}}"
  settings.textInputBackground: "{{BGDark}}"
  settings.textInputForeground: "{{FG}}"
  settings.textInputBorder: "{{BGDarker}}"
  settings.numberInputBackground: "{{BGDark}}"
  settings.numberInputForeground: "{{FG}}"
  settings.numberInputBorder: "{{BGDarker}}"

  # Breadcrumbs
  breadcrumb.foreground: "{{COMMENT}}"
  breadcrumb.background: "{{BG}}"
  breadcrumb.focusForeground: "{{FG}}"
  breadcrumb.activeSelectionForeground: "{{FG}}"
  breadcrumbPicker.background: "{{BGDarker}}"

  # Misc
  listFilterWidget.background: "{{BGLight}}"
  listFilterWidget.outline: "{{BGLighter}}"
  listFilterWidget.noMatchesOutline: "{{RED}}"

# =============================================================================
# Token Colors (Syntax Highlighting)
# =============================================================================
tokenColors:

  # ===========================================================================
  # General
  # ===========================================================================
  - scope:
      - emphasis
    settings:
      fontStyle: italic

  - scope:
      - strong
    settings:
      fontStyle: bold

  - scope:
      - header
    settings:
      foreground: "{{PURPLE}}"

  # ===========================================================================
  # Diffs
  # ===========================================================================
  - scope:
      - meta.diff
      - meta.diff.header
    settings:
      foreground: "{{COMMENT}}"

  - scope:
      - markup.inserted
    settings:
      foreground: "{{GREEN}}"

  - scope:
      - markup.deleted
    settings:
      foreground: "{{RED}}"

  - scope:
      - markup.changed
    settings:
      foreground: "{{ORANGE}}"

  - scope:
      - invalid
    settings:
      foreground: "{{RED}}"
      fontStyle: underline italic

  - scope:
      - invalid.deprecated
    settings:
      foreground: "{{FG}}"
      fontStyle: underline italic

  - scope:
      - entity.name.filename
    settings:
      foreground: "{{YELLOW}}"

  - scope:
      - markup.error
    settings:
      foreground: "{{RED}}"

  # ===========================================================================
  # Markdown / RST / Prose
  # ===========================================================================
  - name: Underlined markup
    scope:
      - markup.underline
    settings:
      fontStyle: underline

  - name: Bold markup
    scope:
      - markup.bold
    settings:
      fontStyle: bold
      foreground: "{{ORANGE}}"

  - name: Markup headings
    scope:
      - markup.heading
    settings:
      fontStyle: bold
      foreground: "{{PURPLE}}"

  - name: Markup italic
    scope:
      - markup.italic
    settings:
      foreground: "{{YELLOW}}"
      fontStyle: italic

  - name: Bullets, lists (prose)
    scope:
      - beginning.punctuation.definition.list.markdown
      - beginning.punctuation.definition.quote.markdown
      - punctuation.definition.link.restructuredtext
    settings:
      foreground: "{{CYAN}}"

  - name: Inline code (prose)
    scope:
      - markup.inline.raw
      - markup.raw.restructuredtext
    settings:
      foreground: "{{GREEN}}"

  - name: Links (prose)
    scope:
      - markup.underline.link
      - markup.underline.link.image
    settings:
      foreground: "{{CYAN}}"

  - name: Link text, image alt text (prose)
    scope:
      - meta.link.reference.def.restructuredtext
      - punctuation.definition.directive.restructuredtext
      - string.other.link.description
      - string.other.link.title
    settings:
      foreground: "{{PINK}}"

  - name: Blockquotes (prose)
    scope:
      - entity.name.directive.restructuredtext
      - markup.quote
    settings:
      foreground: "{{YELLOW}}"
      fontStyle: italic

  - name: Horizontal rule (prose)
    scope:
      - meta.separator.markdown
    settings:
      foreground: "{{COMMENT}}"

  - name: Code blocks
    scope:
      - fenced_code.block.language
      - markup.raw.inner.restructuredtext
      - markup.fenced_code.block.markdown punctuation.definition.markdown
    settings:
      foreground: "{{GREEN}}"

  - name: Prose constants
    scope:
      - punctuation.definition.constant.restructuredtext
    settings:
      foreground: "{{PURPLE}}"

  - name: Braces in markdown headings
    scope:
      - markup.heading.markdown punctuation.definition.string.begin
      - markup.heading.markdown punctuation.definition.string.end
    settings:
      foreground: "{{PURPLE}}"

  - name: Braces in markdown paragraphs
    scope:
      - meta.paragraph.markdown punctuation.definition.string.begin
      - meta.paragraph.markdown punctuation.definition.string.end
    settings:
      foreground: "{{FG}}"

  - name: Braces in markdown blockquotes
    scope:
      - markup.quote.markdown meta.paragraph.markdown punctuation.definition.string.begin
      - markup.quote.markdown meta.paragraph.markdown punctuation.definition.string.end
    settings:
      foreground: "{{YELLOW}}"

  # ===========================================================================
  # Classes
  # ===========================================================================
  - name: User-defined class names
    scope:
      - entity.name.type.class
      - entity.name.class
    settings:
      foreground: "{{CYAN}}"
      fontStyle: normal

  - name: this, super, self, etc.
    scope:
      - keyword.expressions-and-types.swift
      - keyword.other.this
      - variable.language
      - variable.language punctuation.definition.variable.php
      - variable.other.readwrite.instance.ruby
      - variable.parameter.function.language.special
    settings:
      foreground: "{{PURPLE}}"
      fontStyle: italic

  - name: Inherited classes
    scope:
      - entity.other.inherited-class
    settings:
      fontStyle: italic
      foreground: "{{CYAN}}"

  # ===========================================================================
  # Comments
  # ===========================================================================
  - name: Comments
    scope:
      - comment
      - punctuation.definition.comment
      - unused.comment
      - wildcard.comment
    settings:
      foreground: "{{COMMENT}}"

  - name: JSDoc-style keywords
    scope:
      - comment keyword.codetag.notation
      - comment.block.documentation keyword
      - comment.block.documentation storage.type.class
    settings:
      foreground: "{{PINK}}"

  - name: JSDoc-style types
    scope:
      - comment.block.documentation entity.name.type
    settings:
      foreground: "{{CYAN}}"
      fontStyle: italic

  - name: JSDoc-style type brackets
    scope:
      - comment.block.documentation entity.name.type punctuation.definition.bracket
    settings:
      foreground: "{{CYAN}}"

  - name: JSDoc-style comment parameters
    scope:
      - comment.block.documentation variable
    settings:
      foreground: "{{ORANGE}}"
      fontStyle: italic

  # ===========================================================================
  # Constants
  # ===========================================================================
  - name: Constants
    scope:
      - constant
      - variable.other.constant
    settings:
      foreground: "{{PURPLE}}"

  - name: Constant escape sequences
    scope:
      - constant.character.escape
      - constant.character.string.escape
      - constant.regexp
    settings:
      foreground: "{{PINK}}"

  # ===========================================================================
  # Entities (HTML/XML Tags)
  # ===========================================================================
  - name: HTML tags
    scope:
      - entity.name.tag
    settings:
      foreground: "{{PINK}}"

  - name: CSS attribute parent selectors ('&')
    scope:
      - entity.other.attribute-name.parent-selector
    settings:
      foreground: "{{PINK}}"

  - name: HTML/CSS attribute names
    scope:
      - entity.other.attribute-name
    settings:
      foreground: "{{GREEN}}"
      fontStyle: italic

  # ===========================================================================
  # Functions/Methods
  # ===========================================================================
  - name: Function names
    scope:
      - entity.name.function
      - meta.function-call.object
      - meta.function-call.php
      - meta.function-call.static
      - meta.method-call.java meta.method
      - meta.method.groovy
      - support.function.any-method.lua
      - keyword.operator.function.infix
    settings:
      foreground: "{{GREEN}}"

  - name: Function parameters
    scope:
      - entity.name.variable.parameter
      - meta.at-rule.function variable
      - meta.at-rule.mixin variable
      - meta.function.arguments variable.other.php
      - meta.selectionset.graphql meta.arguments.graphql variable.arguments.graphql
      - variable.parameter
    settings:
      fontStyle: italic
      foreground: "{{ORANGE}}"

  - name: Decorators
    scope:
      - meta.decorator variable.other.readwrite
      - meta.decorator variable.other.property
    settings:
      foreground: "{{GREEN}}"
      fontStyle: italic

  - name: Decorator Objects
    scope:
      - meta.decorator variable.other.object
    settings:
      foreground: "{{GREEN}}"

  # ===========================================================================
  # Keywords
  # ===========================================================================
  - name: Keywords
    scope:
      - keyword
      - punctuation.definition.keyword
    settings:
      foreground: "{{PINK}}"

  - name: Keyword "new"
    scope:
      - keyword.control.new
      - keyword.operator.new
    settings:
      fontStyle: bold

  - name: Generic selectors (CSS/SCSS/Less/Stylus)
    scope:
      - meta.selector
    settings:
      foreground: "{{PINK}}"

  # ===========================================================================
  # Language Built-ins
  # ===========================================================================
  - name: Language Built-ins
    scope:
      - support
    settings:
      fontStyle: italic
      foreground: "{{CYAN}}"

  - name: Built-in magic functions and constants
    scope:
      - support.function.magic
      - support.variable
      - variable.other.predefined
    settings:
      fontStyle: regular
      foreground: "{{PURPLE}}"

  - name: Built-in functions / properties
    scope:
      - support.function
      - support.type.property-name
    settings:
      fontStyle: regular

  # ===========================================================================
  # Punctuation
  # ===========================================================================
  - name: Separators (key/value, namespace, inheritance, pointer, hash, slice, etc)
    scope:
      - constant.other.symbol.hashkey punctuation.definition.constant.ruby
      - entity.other.attribute-name.placeholder punctuation
      - entity.other.attribute-name.pseudo-class punctuation
      - entity.other.attribute-name.pseudo-element punctuation
      - meta.group.double.toml
      - meta.group.toml
      - meta.object-binding-pattern-variable punctuation.destructuring
      - punctuation.colon.graphql
      - punctuation.definition.block.scalar.folded.yaml
      - punctuation.definition.block.scalar.literal.yaml
      - punctuation.definition.block.sequence.item.yaml
      - punctuation.definition.entity.other.inherited-class
      - punctuation.function.swift
      - punctuation.separator.dictionary.key-value
      - punctuation.separator.hash
      - punctuation.separator.inheritance
      - punctuation.separator.key-value
      - punctuation.separator.key-value.mapping.yaml
      - punctuation.separator.namespace
      - punctuation.separator.pointer-access
      - punctuation.separator.slice
      - string.unquoted.heredoc punctuation.definition.string
      - support.other.chomping-indicator.yaml
      - punctuation.separator.annotation
    settings:
      foreground: "{{PINK}}"

  - name: Brackets, braces, parens, etc.
    scope:
      - keyword.operator.other.powershell
      - keyword.other.statement-separator.powershell
      - meta.brace.round
      - meta.function-call punctuation
      - punctuation.definition.arguments.begin
      - punctuation.definition.arguments.end
      - punctuation.definition.entity.begin
      - punctuation.definition.entity.end
      - punctuation.definition.tag.cs
      - punctuation.definition.type.begin
      - punctuation.definition.type.end
      - punctuation.section.scope.begin
      - punctuation.section.scope.end
      - punctuation.terminator.expression.php
      - storage.type.generic.java
      - string.template meta.brace
      - string.template punctuation.accessor
    settings:
      foreground: "{{FG}}"

  - name: Variable interpolation operators
    scope:
      - meta.string-contents.quoted.double punctuation.definition.variable
      - punctuation.definition.interpolation.begin
      - punctuation.definition.interpolation.end
      - punctuation.definition.template-expression.begin
      - punctuation.definition.template-expression.end
      - punctuation.section.embedded.begin
      - punctuation.section.embedded.coffee
      - punctuation.section.embedded.end
      - punctuation.section.embedded.end source.php
      - punctuation.section.embedded.end source.ruby
      - punctuation.definition.variable.makefile
    settings:
      foreground: "{{PINK}}"

  # ===========================================================================
  # Serializable / Config Languages
  # ===========================================================================
  - name: Keys (serializable languages)
    scope:
      - entity.name.function.target.makefile
      - entity.name.section.toml
      - entity.name.tag.yaml
      - variable.other.key.toml
    settings:
      foreground: "{{CYAN}}"

  - name: Dates / timestamps (serializable languages)
    scope:
      - constant.other.date
      - constant.other.timestamp
    settings:
      foreground: "{{ORANGE}}"

  - name: YAML aliases
    scope:
      - variable.other.alias.yaml
    settings:
      fontStyle: italic underline
      foreground: "{{GREEN}}"

  # ===========================================================================
  # Storage
  # ===========================================================================
  - name: Storage
    scope:
      - storage
      - meta.implementation storage.type.objc
      - meta.interface-or-protocol storage.type.objc
      - source.groovy storage.type.def
    settings:
      fontStyle: regular
      foreground: "{{PINK}}"

  - name: Types
    scope:
      - entity.name.type
      - keyword.primitive-datatypes.swift
      - keyword.type.cs
      - meta.protocol-list.objc
      - meta.return-type.objc
      - source.go storage.type
      - source.groovy storage.type
      - source.java storage.type
      - source.powershell entity.other.attribute-name
      - storage.class.std.rust
      - storage.type.attribute.swift
      - storage.type.c
      - storage.type.core.rust
      - storage.type.cs
      - storage.type.groovy
      - storage.type.objc
      - storage.type.php
      - storage.type.haskell
      - storage.type.ocaml
    settings:
      fontStyle: italic
      foreground: "{{CYAN}}"

  - name: Generics, templates, and mapped type declarations
    scope:
      - entity.name.type.type-parameter
      - meta.indexer.mappedtype.declaration entity.name.type
      - meta.type.parameters entity.name.type
    settings:
      foreground: "{{ORANGE}}"

  - name: Modifiers
    scope:
      - storage.modifier
    settings:
      foreground: "{{PINK}}"

  # ===========================================================================
  # RegExp
  # ===========================================================================
  - name: RegExp string
    scope:
      - string.regexp
      - constant.other.character-class.set.regexp
      - constant.character.escape.backslash.regexp
    settings:
      foreground: "{{YELLOW}}"

  - name: Non-capture operators
    scope:
      - punctuation.definition.group.capture.regexp
    settings:
      foreground: "{{PINK}}"

  - name: RegExp start and end characters
    scope:
      - string.regexp punctuation.definition.string.begin
      - string.regexp punctuation.definition.string.end
    settings:
      foreground: "{{RED}}"

  - name: Character group
    scope:
      - punctuation.definition.character-class.regexp
    settings:
      foreground: "{{CYAN}}"

  - name: Capture groups
    scope:
      - punctuation.definition.group.regexp
    settings:
      foreground: "{{ORANGE}}"

  - name: Assertion operators
    scope:
      - punctuation.definition.group.assertion.regexp
      - keyword.operator.negation.regexp
    settings:
      foreground: "{{RED}}"

  - name: Positive lookaheads
    scope:
      - meta.assertion.look-ahead.regexp
    settings:
      foreground: "{{GREEN}}"

  # ===========================================================================
  # Strings
  # ===========================================================================
  - name: Strings
    scope:
      - string
    settings:
      foreground: "{{YELLOW}}"

  - name: String quotes (temporary vscode fix)
    scope:
      - punctuation.definition.string.begin
      - punctuation.definition.string.end
    settings:
      foreground: "{{TEMP_QUOTES}}"

  - name: Property quotes (temporary vscode fix)
    scope:
      - punctuation.support.type.property-name.begin
      - punctuation.support.type.property-name.end
    settings:
      foreground: "{{TEMP_PROPERTY_QUOTES}}"

  - name: Docstrings
    scope:
      - string.quoted.docstring.multi
      - string.quoted.docstring.multi.python punctuation.definition.string.begin
      - string.quoted.docstring.multi.python punctuation.definition.string.end
      - string.quoted.docstring.multi.python constant.character.escape
    settings:
      foreground: "{{COMMENT}}"

  # ===========================================================================
  # Variables
  # ===========================================================================
  - name: Variables
    scope:
      - variable
      - constant.other.key.perl
    settings:
      foreground: "{{FG}}"

  - name: Object properties
    scope:
      - variable.other.property
      - support.variable.property
      - variable.other.object.property
    settings:
      foreground: "{{FG}}"

  - name: Constant variables (JS/TS)
    scope:
      - variable.other.constant.js
      - variable.other.constant.ts
      - variable.other.constant.tsx
    settings:
      foreground: "{{PURPLE}}"

  - name: Destructuring / aliasing reference name (LHS)
    scope:
      - meta.import variable.other.readwrite
      - meta.variable.assignment.destructured.object.coffee variable
    settings:
      fontStyle: italic
      foreground: "{{ORANGE}}"

  - name: Destructuring / aliasing variable name (RHS)
    scope:
      - meta.import variable.other.readwrite.alias
      - meta.export variable.other.readwrite.alias
      - meta.variable.assignment.destructured.object.coffee variable variable
    settings:
      fontStyle: normal
      foreground: "{{FG}}"

  # ===========================================================================
  # Language Extensions / Edge Cases
  # ===========================================================================
  # GraphQL
  - name: GraphQL keys
    scope:
      - meta.selectionset.graphql variable
    settings:
      foreground: "{{YELLOW}}"

  - name: GraphQL function arguments
    scope:
      - meta.selectionset.graphql meta.arguments variable
    settings:
      foreground: "{{FG}}"

  - name: GraphQL fragment name (definition)
    scope:
      - entity.name.fragment.graphql
      - variable.fragment.graphql
    settings:
      foreground: "{{CYAN}}"

  # Edge Cases
  - name: Edge cases (foreground color resets)
    scope:
      - constant.other.symbol.hashkey.ruby
      - keyword.operator.dereference.java
      - keyword.operator.navigation.groovy
      - meta.scope.for-loop.shell punctuation.definition.string.begin
      - meta.scope.for-loop.shell punctuation.definition.string.end
      - meta.scope.for-loop.shell string
      - storage.modifier.import
      - punctuation.separator.list.comma.css
      - constant.language.empty-list.haskell
    settings:
      foreground: "{{FG}}"

  - name: Shell variables prefixed with "$" (edge case)
    scope:
      - source.shell variable.other
    settings:
      foreground: "{{PURPLE}}"

  - name: Powershell constants mistakenly scoped to `support`, rather than `constant` (edge)
    scope:
      - support.constant
    settings:
      fontStyle: normal
      foreground: "{{PURPLE}}"

  - name: Makefile prerequisite names
    scope:
      - meta.scope.prerequisites.makefile
    settings:
      foreground: "{{YELLOW}}"

  - name: SCSS attribute selector strings
    scope:
      - meta.attribute-selector.scss
    settings:
      foreground: "{{YELLOW}}"

  - name: SCSS attribute selector brackets
    scope:
      - punctuation.definition.attribute-selector.end.bracket.square.scss
      - punctuation.definition.attribute-selector.begin.bracket.square.scss
    settings:
      foreground: "{{FG}}"

  - name: Haskell Pragmas
    scope:
      - meta.preprocessor.haskell
    settings:
      foreground: "{{COMMENT}}"

  - name: Log file error
    scope:
      - log.error
    settings:
      foreground: "{{RED}}"
      fontStyle: bold

  - name: Log file warning
    scope:
      - log.warning
    settings:
      foreground: "{{YELLOW}}"
      fontStyle: bold

  # ===========================================================================
  # Numbers
  # ===========================================================================
  - name: Numbers
    scope:
      - constant.numeric
      - constant.numeric.integer
      - constant.numeric.float
      - constant.numeric.hex
      - constant.numeric.octal
      - constant.numeric.binary
    settings:
      foreground: "{{PURPLE}}"

  # ===========================================================================
  # Operators
  # ===========================================================================
  - name: Operators
    scope:
      - keyword.operator
    settings:
      foreground: "{{PINK}}"

  - name: Arithmetic operators
    scope:
      - keyword.operator.arithmetic
    settings:
      foreground: "{{PINK}}"

  - name: Assignment operators
    scope:
      - keyword.operator.assignment
    settings:
      foreground: "{{PINK}}"

  - name: Comparison operators
    scope:
      - keyword.operator.comparison
      - keyword.operator.relational
    settings:
      foreground: "{{PINK}}"

  - name: Logical operators
    scope:
      - keyword.operator.logical
    settings:
      foreground: "{{PINK}}"

  # ===========================================================================
  # JSON
  # ===========================================================================
  - name: JSON property names
    scope:
      - support.type.property-name.json
    settings:
      foreground: "{{CYAN}}"

  - name: JSON string values
    scope:
      - string.quoted.double.json
    settings:
      foreground: "{{YELLOW}}"

  # ===========================================================================
  # CSS/SCSS
  # ===========================================================================
  - name: CSS property names
    scope:
      - support.type.property-name.css
      - support.type.vendored.property-name.css
    settings:
      foreground: "{{CYAN}}"

  - name: CSS property values
    scope:
      - support.constant.property-value.css
    settings:
      foreground: "{{ORANGE}}"

  - name: CSS units
    scope:
      - keyword.other.unit.css
    settings:
      foreground: "{{PURPLE}}"

  - name: CSS selectors
    scope:
      - entity.other.attribute-name.class.css
      - entity.other.attribute-name.id.css
    settings:
      foreground: "{{GREEN}}"

  - name: CSS pseudo-classes
    scope:
      - entity.other.attribute-name.pseudo-class.css
      - entity.other.attribute-name.pseudo-element.css
    settings:
      foreground: "{{GREEN}}"
      fontStyle: italic

  - name: SCSS variables
    scope:
      - variable.scss
      - variable.sass
    settings:
      foreground: "{{ORANGE}}"

  # ===========================================================================
  # TypeScript/JavaScript specific
  # ===========================================================================
  - name: TypeScript interface
    scope:
      - entity.name.type.interface.ts
      - entity.name.type.interface.tsx
    settings:
      foreground: "{{CYAN}}"

  - name: TypeScript type alias
    scope:
      - entity.name.type.alias.ts
      - entity.name.type.alias.tsx
    settings:
      foreground: "{{CYAN}}"

  - name: TypeScript enum
    scope:
      - entity.name.type.enum.ts
      - entity.name.type.enum.tsx
    settings:
      foreground: "{{CYAN}}"

  # ===========================================================================
  # JSX/TSX specific (React)
  # ===========================================================================
  - name: JSX/TSX component tags (custom React components)
    scope:
      - support.class.component.js
      - support.class.component.jsx
      - support.class.component.ts
      - support.class.component.tsx
      - entity.name.tag.js
      - entity.name.tag.tsx
    settings:
      foreground: "{{CYAN}}"

  - name: JSX/TSX HTML tags
    scope:
      - entity.name.tag.html.js
      - entity.name.tag.html.jsx
      - entity.name.tag.html.ts
      - entity.name.tag.html.tsx
    settings:
      foreground: "{{PINK}}"

  - name: JSX/TSX attribute names (className, onClick, etc.)
    scope:
      - entity.other.attribute-name.js
      - entity.other.attribute-name.jsx
      - entity.other.attribute-name.ts
      - entity.other.attribute-name.tsx
      - meta.tag.attributes entity.other.attribute-name
    settings:
      foreground: "{{GREEN}}"
      fontStyle: italic

  - name: JSX/TSX string attribute values
    scope:
      - string.quoted.double.js
      - string.quoted.single.js
      - string.quoted.double.jsx
      - string.quoted.single.jsx
      - string.quoted.double.ts
      - string.quoted.single.ts
      - string.quoted.double.tsx
      - string.quoted.single.tsx
      - meta.jsx.children string
      - meta.tag string.quoted
    settings:
      foreground: "{{YELLOW}}"

  - name: JSX/TSX curly braces in expressions
    scope:
      - punctuation.section.embedded.begin.js
      - punctuation.section.embedded.end.js
      - punctuation.section.embedded.begin.jsx
      - punctuation.section.embedded.end.jsx
      - punctuation.section.embedded.begin.ts
      - punctuation.section.embedded.end.ts
      - punctuation.section.embedded.begin.tsx
      - punctuation.section.embedded.end.tsx
    settings:
      foreground: "{{PINK}}"

  - name: JSX/TSX tag brackets
    scope:
      - punctuation.definition.tag.begin.js
      - punctuation.definition.tag.end.js
      - punctuation.definition.tag.begin.jsx
      - punctuation.definition.tag.end.jsx
      - punctuation.definition.tag.begin.ts
      - punctuation.definition.tag.end.ts
      - punctuation.definition.tag.begin.tsx
      - punctuation.definition.tag.end.tsx
    settings:
      foreground: "{{FG}}"

  - name: JSX text content
    scope:
      - meta.jsx.children
      - meta.jsx.children.tsx
    settings:
      foreground: "{{FG}}"

  - name: Template literal strings
    scope:
      - string.template
      - string.template.js
      - string.template.ts
      - string.template.tsx
    settings:
      foreground: "{{YELLOW}}"

  - name: Template literal expressions
    scope:
      - punctuation.definition.template-expression.begin
      - punctuation.definition.template-expression.end
    settings:
      foreground: "{{PINK}}"

  # ===========================================================================
  # Python specific
  # ===========================================================================
  - name: Python self
    scope:
      - variable.parameter.function.language.special.self.python
    settings:
      foreground: "{{PURPLE}}"
      fontStyle: italic

  - name: Python cls
    scope:
      - variable.parameter.function.language.special.cls.python
    settings:
      foreground: "{{PURPLE}}"
      fontStyle: italic

  - name: Python magic methods
    scope:
      - support.function.magic.python
    settings:
      foreground: "{{GREEN}}"

  - name: Python decorators
    scope:
      - entity.name.function.decorator.python
    settings:
      foreground: "{{GREEN}}"
      fontStyle: italic

  # ===========================================================================
  # HTML specific
  # ===========================================================================
  - name: HTML doctype
    scope:
      - meta.tag.metadata.doctype.html
      - meta.tag.sgml.doctype
      - meta.tag.sgml.doctype entity.name.tag
      - meta.tag.sgml.doctype string
    settings:
      foreground: "{{COMMENT}}"

  - name: HTML attribute values
    scope:
      - meta.tag string.quoted
      - string.quoted.double.html
      - string.quoted.single.html
    settings:
      foreground: "{{YELLOW}}"

  - name: HTML punctuation (< > / =)
    scope:
      - punctuation.definition.tag.begin.html
      - punctuation.definition.tag.end.html
      - meta.tag.other.unrecognized.html.derivative punctuation.definition.tag
    settings:
      foreground: "{{FG}}"
