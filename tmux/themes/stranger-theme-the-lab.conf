# Stranger Theme: The Lab for tmux
set -g status-style "fg=#E0E5EC,bg=#10131C"
set -g status-left-style "fg=#1A1D26,bg=#7FDBFF,bold"
set -g status-right-style "fg=#1A1D26,bg=#B10DC9"
set -g window-status-style "fg=#73879C,bg=#10131C"
set -g window-status-current-style "fg=#1A1D26,bg=#39CCCC,bold"
set -g pane-border-style "fg=#3C3F48"
set -g pane-active-border-style "fg=#7FDBFF"
set -g message-style "fg=#E0E5EC,bg=#3C3F48"
set -g message-command-style "fg=#E0E5EC,bg=#3C3F48"
set -g mode-style "fg=#E0E5EC,bg=#3C3F48"
set -g clock-mode-colour "#7FDBFF"
