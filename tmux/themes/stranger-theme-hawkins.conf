# Stranger Theme: Hawkins for tmux
set -g status-style "fg=#E8DCC8,bg=#22180E"
set -g status-left-style "fg=#2C2218,bg=#D4A574,bold"
set -g status-right-style "fg=#2C2218,bg=#B48EAD"
set -g window-status-style "fg=#9E8766,bg=#22180E"
set -g window-status-current-style "fg=#2C2218,bg=#88C0D0,bold"
set -g pane-border-style "fg=#4D4339"
set -g pane-active-border-style "fg=#D4A574"
set -g message-style "fg=#E8DCC8,bg=#4D4339"
set -g message-command-style "fg=#E8DCC8,bg=#4D4339"
set -g mode-style "fg=#E8DCC8,bg=#4D4339"
set -g clock-mode-colour "#D4A574"
