# Stranger Theme: Tigers for tmux
set -g status-style "fg=#F5F5F5,bg=#0E140E"
set -g status-left-style "fg=#181E18,bg=#FF7F2A,bold"
set -g status-right-style "fg=#181E18,bg=#B294BB"
set -g window-status-style "fg=#758975,bg=#0E140E"
set -g window-status-current-style "fg=#181E18,bg=#81A2BE,bold"
set -g pane-border-style "fg=#38463A"
set -g pane-active-border-style "fg=#FF7F2A"
set -g message-style "fg=#F5F5F5,bg=#38463A"
set -g message-command-style "fg=#F5F5F5,bg=#38463A"
set -g mode-style "fg=#F5F5F5,bg=#38463A"
set -g clock-mode-colour "#FF7F2A"
