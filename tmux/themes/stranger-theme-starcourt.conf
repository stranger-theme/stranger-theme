# Stranger Theme: Starcourt for tmux
set -g status-style "fg=#EAEAEA,bg=#101024"
set -g status-left-style "fg=#1A1A2E,bg=#FF1493,bold"
set -g status-right-style "fg=#1A1A2E,bg=#BA55D3"
set -g window-status-style "fg=#8C77C3,bg=#101024"
set -g window-status-current-style "fg=#1A1A2E,bg=#00CED1,bold"
set -g pane-border-style "fg=#3D3D66"
set -g pane-active-border-style "fg=#FF1493"
set -g message-style "fg=#EAEAEA,bg=#3D3D66"
set -g message-command-style "fg=#EAEAEA,bg=#3D3D66"
set -g mode-style "fg=#EAEAEA,bg=#3D3D66"
set -g clock-mode-colour "#FF1493"
