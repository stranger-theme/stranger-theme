# Stranger Theme: Upside Down for tmux
set -g status-style "fg=#F8F8F2,bg=#03070D"
set -g status-left-style "fg=#0D1117,bg=#C678DD,bold"
set -g status-right-style "fg=#0D1117,bg=#61AFEF"
set -g window-status-style "fg=#7A8495,bg=#03070D"
set -g window-status-current-style "fg=#0D1117,bg=#56B6C2,bold"
set -g pane-border-style "fg=#2A3C4A"
set -g pane-active-border-style "fg=#C678DD"
set -g message-style "fg=#F8F8F2,bg=#2A3C4A"
set -g message-command-style "fg=#F8F8F2,bg=#2A3C4A"
set -g mode-style "fg=#F8F8F2,bg=#2A3C4A"
set -g clock-mode-colour "#C678DD"
