# Stranger Theme: Dimension X for tmux
set -g status-style "fg=#E8D5D5,bg=#141010"
set -g status-left-style "fg=#1E1A1A,bg=#E06C75,bold"
set -g status-right-style "fg=#1E1A1A,bg=#C678DD"
set -g window-status-style "fg=#9A7C7C,bg=#141010"
set -g window-status-current-style "fg=#1E1A1A,bg=#D19A66,bold"
set -g pane-border-style "fg=#523535"
set -g pane-active-border-style "fg=#E06C75"
set -g message-style "fg=#E8D5D5,bg=#523535"
set -g message-command-style "fg=#E8D5D5,bg=#523535"
set -g mode-style "fg=#E8D5D5,bg=#523535"
set -g clock-mode-colour "#E06C75"
